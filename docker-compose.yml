services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tinynotes
      POSTGRES_USER: tinynotes
      POSTGRES_PASSWORD: tinynotes
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - tinynotes_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tinynotes -d tinynotes']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: tinynotes_test
      POSTGRES_USER: tinynotes_test
      POSTGRES_PASSWORD: tinynotes_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tinynotes_test -d tinynotes_test']
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    profiles: ['production']
    build: .
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://tinynotes:tinynotes@postgres:5432/tinynotes
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to a high-entropy value}
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      LOG_LEVEL: info
      TRUST_PROXY: 'false'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tinynotes_postgres:
